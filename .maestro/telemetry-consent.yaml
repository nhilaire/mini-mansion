appId: io.github.nhilaire.minimansion
name: Telemetry - accept consent, start a game, finish the tutorial and solve E01 (events checked in logcat by verify.mjs, AC-08)
tags:
  - telemetry
---
- launchApp:
    clearState: true
- tapOn:
    id: "consent-accept"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- openLink: "minimansion://test/fast"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- tapOn:
    id: "home-new-game"
- tapOn:
    id: "intro-skip"
- extendedWaitUntil:
    visible:
      id: "scene-idle"
    timeout: 15000
- tapOn:
    point: "30%,72%"
- extendedWaitUntil:
    visible:
      id: "scene-idle"
    timeout: 15000
- tapOn:
    id: "hs-front.doormat"
- tapOn:
    id: "verb-take"
- extendedWaitUntil:
    visible:
      id: "scene-idle"
    timeout: 15000
- tapOn:
    id: "inv-key"
- tapOn:
    id: "hs-front.door"
- extendedWaitUntil:
    visible:
      id: "hs-hall.coats"
    timeout: 15000
- takeScreenshot: telemetry-hall
