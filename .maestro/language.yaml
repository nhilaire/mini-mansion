appId: io.github.nhilaire.minimansion
name: Language - switch from the settings, the whole UI follows at once and the choice survives a restart (AC-04)
tags:
  - language
---
- launchApp:
    clearState: true
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Paramètres"
- assertVisible: "Bruitages"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- assertVisible: "Sound effects"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- assertVisible: "New game"
- assertVisible: "The House Secret"
- takeScreenshot: language-en-home
- stopApp
- launchApp:
    stopApp: false
- assertVisible: "New game"
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-auto"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- assertVisible: "Nouvelle partie"
- assertVisible: "Le Secret de la Maison"
