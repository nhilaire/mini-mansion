appId: io.github.nhilaire.minimansion
name: Smoke (any phone language) - first launch, refuse telemetry, start a game
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: "consent-screen"
- tapOn:
    id: "consent-refuse"
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "home-new-game"
- tapOn:
    id: "intro-skip"
- extendedWaitUntil:
    visible:
      id: "game-screen"
    timeout: 15000
- assertVisible:
    id: "hs-front.doormat"
- takeScreenshot: smoke-front
